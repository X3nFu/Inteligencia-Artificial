<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pruebas del Mundo de la Aspiradora</title>
<style>
  :root {
    --fondo: #eef1f6;
    --superficie: #ffffff;
    --borde: #d6dce7;
    --texto: #1d2433;
    --texto-suave: #5b6678;
    --acento: #2f6df6;
    --limpio: #3fb27f;
    --ocupado: #d5534f;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --fondo: #12161f;
      --superficie: #1a202c;
      --borde: #2c3444;
      --texto: #e8ecf4;
      --texto-suave: #9aa5b8;
      --acento: #5b8dff;
    }
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 2rem 1.2rem 4rem;
    background: var(--fondo);
    color: var(--texto);
    font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    line-height: 1.5;
  }

  main { max-width: 940px; margin: 0 auto; }

  h1 { margin: 0 0 .3rem; font-size: 1.5rem; }

  .intro { margin: 0 0 1.5rem; color: var(--texto-suave); font-size: .92rem; }

  .resumen {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    border: 1px solid var(--borde);
    background: var(--superficie);
    margin-bottom: 1.2rem;
  }

  .marca {
    font-size: 1.6rem;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
  }

  .resumen.exito .marca { color: var(--limpio); }
  .resumen.fallo .marca { color: var(--ocupado); }
  .resumen .detalle { color: var(--texto-suave); font-size: .9rem; }

  pre {
    margin: 0;
    padding: 1rem 1.2rem;
    border-radius: 12px;
    border: 1px solid var(--borde);
    background: var(--superficie);
    font-family: "Cascadia Mono", Consolas, ui-monospace, monospace;
    font-size: .8rem;
    line-height: 1.6;
    overflow-x: auto;
    white-space: pre;
  }

  .ok    { color: var(--limpio); }
  .falla { color: var(--ocupado); font-weight: 700; }
  .grupo { color: var(--acento); font-weight: 700; }
</style>
</head>
<body>
<main>
  <h1>Pruebas del motor</h1>
  <p class="intro">
    Las mismas comprobaciones que se corren con <code>node pruebas/pruebas.js</code>, ejecutadas
    aquí sin instalar nada. Verifican la l&oacute;gica del agente y del mundo, no la parte gr&aacute;fica.
  </p>

  <div class="resumen" id="resumen">
    <span class="marca" id="marca">…</span>
    <span class="detalle" id="detalle">Ejecutando las comprobaciones…</span>
  </div>

  <pre id="salida"></pre>
</main>

<script src="../js/mundo.js"></script>
<script>
// Recoge lo que pruebas.js escribe con console.log, lo colorea y lo vuelca
// en la pagina, con el resumen arriba.
(function () {
  'use strict';

  var salida = document.getElementById('salida');
  var original = console.log;
  var lineas = [];

  console.log = function () {
    var texto = Array.prototype.join.call(arguments, ' ');
    lineas.push(texto);
    original.apply(console, arguments);
  };

  function pintar() {
    var html = lineas.join('\n').split('\n').map(function (linea) {
      var seguro = linea
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
      if (linea.indexOf('  ok   ') === 0) {
        return '<span class="ok">' + seguro + '</span>';
      }
      if (linea.indexOf('  FALLA') === 0) {
        return '<span class="falla">' + seguro + '</span>';
      }
      if (linea && linea[0] !== ' ') {
        return '<span class="grupo">' + seguro + '</span>';
      }
      return seguro;
    }).join('\n');
    salida.innerHTML = html;
  }

  function resumir() {
    var correctas = 0, fallidas = 0;
    lineas.join('\n').split('\n').forEach(function (linea) {
      if (linea.indexOf('  ok   ') === 0) correctas++;
      if (linea.indexOf('  FALLA') === 0) fallidas++;
    });

    var caja = document.getElementById('resumen');
    var total = correctas + fallidas;
    document.getElementById('marca').textContent = correctas + '/' + total;
    caja.className = 'resumen ' + (fallidas === 0 ? 'exito' : 'fallo');
    document.getElementById('detalle').textContent = fallidas === 0
      ? 'Todas las comprobaciones pasan.'
      : fallidas + (fallidas === 1 ? ' comprobación falla.' : ' comprobaciones fallan.');
  }

  // Un respiro para que la página se pinte antes de ponerse a calcular:
  // las pruebas corren varios miles de simulaciones y bloquean el hilo.
  setTimeout(function () {
    var guion = document.createElement('script');
    guion.src = 'pruebas.js';
    guion.onload = function () { pintar(); resumir(); };
    guion.onerror = function () {
      document.getElementById('marca').textContent = '—';
      document.getElementById('detalle').textContent =
        'No se pudo cargar pruebas.js. Comprueba que está junto a esta página.';
    };
    document.body.appendChild(guion);
  }, 60);
})();
</script>
</body>
</html>
